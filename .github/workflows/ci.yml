name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  catraca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Catraca 1 — o TypeScript tem que fechar
      - name: Typecheck
        run: pnpm typecheck

      # Catraca 2 — lint
      - name: Lint
        run: pnpm lint

      # Catraca 3 — testes passando e cobertura mínima
      # Suba o threshold aos poucos. Começa em 50, não em 90.
      - name: Testes
        run: pnpm vitest run --coverage
